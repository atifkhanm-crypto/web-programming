<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Café Cosmo Menu Card</title>
<style>
  body {
    background-color: #1db3e6; /* match the light beige background */
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Arial', sans-serif;
  }

  .menu-card {
    background-color: #7b7e83;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(154, 22, 22, 0.1);
    overflow: hidden;
    width: 300px;
  }

  .menu-card img {
    width: 100%;
    display: block;
    height: 180px;
    object-fit: cover;
  }

  .menu-card-content {
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .menu-card-content .title-price {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .menu-card-content h2 {
    font-size: 18px;
    margin: 0;
    color: #4b3e2d;
  }

  .menu-card-content .price {
    font-weight: bold;
    color: #b99c6b;
  }

  .menu-card-content p {
    font-size: 14px;
    color: #555;
    margin: 0;
  }
</style>
</head>
<body>

<div class="menu-card">
  <img src="coffee.jpg" alt="Galaxy Latte">
  <div class="menu-card-content">
    <div class="title-price">
      <h2>Galaxy Latte</h2>
      <span class="price">₹180</span>
    </div>
    <p>Espresso + oat milk + star dust foam</p>
  </div>
</div>

</body>
</html>
